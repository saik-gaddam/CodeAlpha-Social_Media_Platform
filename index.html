<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha | Social Media Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav>
        <h1>CodeAlpha Feed</h1>
        <div class="profile-info">Welcome, Developer</div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Create Post Card -->
        <div class="create-post-card">
            <textarea id="post-input" rows="3" placeholder="What's on your mind today?"></textarea>
            <div class="post-actions-bar">
                <button class="btn-primary" onclick="createPost()">Post</button>
            </div>
        </div>

        <!-- Dynamic Post Feed -->
        <div id="feed-container">
            <!-- Posts will be injected here by JavaScript -->
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
